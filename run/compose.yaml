name: preditr

services:
  refs-human:
    image: fvasquezcastro/preditr-ref:human-grch38
    volumes:
      - preditr_refs:/refs
    command: ["sh", "-c", "rm -rf /refs/human && mkdir -p /refs && cp -a /image-refs/human /refs/human"]
    restart: "no"

  refs-mouse:
    image: fvasquezcastro/preditr-ref:mouse-mm10
    volumes:
      - preditr_refs:/refs
    command: ["sh", "-c", "rm -rf /refs/mouse && mkdir -p /refs && cp -a /image-refs/mouse /refs/mouse"]
    restart: "no"

  refs-yeast:
    image: fvasquezcastro/preditr-ref:yeast-saccer3
    volumes:
      - preditr_refs:/refs
    command: ["sh", "-c", "rm -rf /refs/yeast && mkdir -p /refs && cp -a /image-refs/yeast /refs/yeast"]
    restart: "no"

  refs-rat:
    image: fvasquezcastro/preditr-ref:rat-rn7
    volumes:
      - preditr_refs:/refs
    command: ["sh", "-c", "rm -rf /refs/rat && mkdir -p /refs && cp -a /image-refs/rat /refs/rat"]
    restart: "no"

  refs-zebrafish:
    image: fvasquezcastro/preditr-ref:zebrafish-danrer11
    volumes:
      - preditr_refs:/refs
    command: ["sh", "-c", "rm -rf /refs/zebrafish && mkdir -p /refs && cp -a /image-refs/zebrafish /refs/zebrafish"]
    restart: "no"

  refs-fruitfly:
    image: fvasquezcastro/preditr-ref:fruitfly-dm6
    volumes:
      - preditr_refs:/refs
    command: ["sh", "-c", "rm -rf /refs/fruitfly && mkdir -p /refs && cp -a /image-refs/fruitfly /refs/fruitfly"]
    restart: "no"

  refs-celegans:
    image: fvasquezcastro/preditr-ref:celegans-ce11
    volumes:
      - preditr_refs:/refs
    command: ["sh", "-c", "rm -rf /refs/celegans && mkdir -p /refs && cp -a /image-refs/celegans /refs/celegans"]
    restart: "no"

  refs-chicken:
    image: fvasquezcastro/preditr-ref:chicken-galgal6
    volumes:
      - preditr_refs:/refs
    command: ["sh", "-c", "rm -rf /refs/chicken && mkdir -p /refs && cp -a /image-refs/chicken /refs/chicken"]
    restart: "no"

  preditr-shiny:
    image: fvasquezcastro/preditr:1.10.0
    ports:
      - "3838:3838"
    volumes:
      - preditr_refs:/refs
      - ./preditr_outputs:/outputs
    environment:
      PREDITR_HOSTED: "TRUE"
      PREDITR_REFERENCES_PATH: /refs
      PREDITR_OUTPUTS_PATH: /outputs
      PREDITR_THREADS: "${PREDITR_THREADS:-2}"
      PREDITR_INPUT_ROWS: "${PREDITR_INPUT_ROWS:-500}"
      PREDITR_FILE_SIZE: "${PREDITR_FILE_SIZE:-500}"
    depends_on:
      refs-human:
        condition: service_completed_successfully
      refs-mouse:
        condition: service_completed_successfully
      refs-yeast:
        condition: service_completed_successfully
      refs-rat:
        condition: service_completed_successfully
      refs-zebrafish:
        condition: service_completed_successfully
      refs-fruitfly:
        condition: service_completed_successfully
      refs-celegans:
        condition: service_completed_successfully
      refs-chicken:
        condition: service_completed_successfully

  preditr-cli:
    image: fvasquezcastro/preditr:1.10.0
    profiles: ["cli"]
    volumes:
      - preditr_refs:/refs
      - ./preditr_inputs:/inputs
      - ./preditr_outputs:/outputs
    environment:
      PREDITR_REFERENCES_PATH: /refs
    depends_on:
      refs-human:
        condition: service_completed_successfully
      refs-mouse:
        condition: service_completed_successfully
      refs-yeast:
        condition: service_completed_successfully
      refs-rat:
        condition: service_completed_successfully
      refs-zebrafish:
        condition: service_completed_successfully
      refs-fruitfly:
        condition: service_completed_successfully
      refs-celegans:
        condition: service_completed_successfully
      refs-chicken:
        condition: service_completed_successfully

volumes:
  preditr_refs:
